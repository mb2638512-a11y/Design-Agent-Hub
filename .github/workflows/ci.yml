name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: python -m json.tool figma-plugin/manifest.json > /dev/null
      - run: python -m json.tool examples/figma-social-post.json > /dev/null
      - run: node --check figma-plugin/code.js
      - run: pytest
